<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="irisGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5AD5FF"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3BA7F2"/>
      <stop offset="100%" stop-color="#1D78D6"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#00121F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- DRAGON EYE OUTLINE (stylized eyelids) -->
  <g filter="url(#shadow)">
    <!-- Upper lid -->
    <path d="M64,512
             C 220,360 420,260 640,272
             C 770,280 880,330 960,396
             C 848,344 736,336 630,356
             C 520,378 418,426 302,470
             C 214,504 140,520 64,512 Z"
          fill="url(#lidGrad)"/>
    <!-- Lower lid -->
    <path d="M64,520
             C 182,612 340,706 512,724
             C 708,746 854,682 960,624
             C 880,668 784,696 678,694
             C 544,691 422,642 306,600
             C 214,566 138,546 64,520 Z"
          fill="#1A6BC8"/>
  </g>

  <!-- IRIS -->
  <circle cx="512" cy="512" r="180" fill="url(#irisGrad)"/>

  <!-- GEAR (integrated into iris) -->
  <g transform="translate(512,512)">
    <!-- outer ring -->
    <circle r="148" fill="none" stroke="#0B2C4C" stroke-width="34"/>
    <!-- teeth (12) -->
    <g fill="#0B2C4C">
      <rect x="-18" y="-204" width="36" height="34" rx="5"/>
      <rect x="-18" y="-204" width="36" height="34" rx="5" transform="rotate(30)"/>
      <rect x="-18" y="-204" width="36" height="34" rx="5" transform="rotate(60)"/>
      <rect x="-18" y="-204" width="36" height="34" rx="5" transform="rotate(90)"/>
      <rect x="-18" y="-204" width="36" height="34" rx="5" transform="rotate(120)"/>
      <rect x="-18" y="-204" width="36" height="34" rx="5" transform="rotate(150)"/>
      <rect x="-18" y="-204" width="36" height="34" rx="5" transform="rotate(180)"/>
      <rect x="-18" y="-204" width="36" height="34" rx="5" transform="rotate(210)"/>
      <rect x="-18" y="-204" width="36" height="34" rx="5" transform="rotate(240)"/>
      <rect x="-18" y="-204" width="36" height="34" rx="5" transform="rotate(270)"/>
      <rect x="-18" y="-204" width="36" height="34" rx="5" transform="rotate(300)"/>
      <rect x="-18" y="-204" width="36" height="34" rx="5" transform="rotate(330)"/>
    </g>
    <!-- hub -->
    <circle r="52" fill="#0B2C4C"/>
  </g>

  <!-- PUPIL (dragon slit) -->
  <path d="M512,360
           C 548,420 560,470 560,512
           C 560,554 548,604 512,664
           C 476,604 464,554 464,512
           C 464,470 476,420 512,360 Z"
        fill="#00121F"/>

  <!-- Highlight -->
  <circle cx="580" cy="444" r="20" fill="#FFFFFF" opacity="0.9"/>
</svg>
