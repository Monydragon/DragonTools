<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1C2A"/>
      <stop offset="100%" stop-color="#0A1420"/>
    </linearGradient>
    <linearGradient id="irisGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4EC3FF"/>
      <stop offset="100%" stop-color="#1976D2"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded background for app icon -->
  <rect x="0" y="0" width="432" height="432" rx="88" ry="88" fill="url(#bgGrad)"/>

  <!-- Foreground graphic group -->
  <g filter="url(#softShadow)">
    <!-- Eyelid top -->
    <path d="M 52 170
             Q 216 60, 380 160
             Q 318 136, 268 148
             Q 216 160, 164 170
             Q 108 182, 52 170 Z"
          fill="#2AA0F2"/>
    <!-- Eyelid bottom -->
    <path d="M 52 266
             Q 216 344, 380 274
             Q 324 286, 270 268
             Q 216 252, 160 240
             Q 110 232, 52 266 Z"
          fill="#1C6FC2"/>
    <!-- Iris -->
    <ellipse cx="216" cy="216" rx="98" ry="98" fill="url(#irisGrad)"/>
    <!-- Gear -->
    <g transform="translate(216,216)">
      <circle r="28" fill="#0E2A4A"/>
      <circle r="62" fill="none" stroke="#0E2A4A" stroke-width="30"/>
      <g fill="#0E2A4A">
        <rect x="-15" y="-100" width="30" height="24" rx="3"/>
        <rect x="-15" y="-100" width="30" height="24" rx="3" transform="rotate(30)"/>
        <rect x="-15" y="-100" width="30" height="24" rx="3" transform="rotate(60)"/>
        <rect x="-15" y="-100" width="30" height="24" rx="3" transform="rotate(90)"/>
        <rect x="-15" y="-100" width="30" height="24" rx="3" transform="rotate(120)"/>
        <rect x="-15" y="-100" width="30" height="24" rx="3" transform="rotate(150)"/>
        <rect x="-15" y="-100" width="30" height="24" rx="3" transform="rotate(180)"/>
        <rect x="-15" y="-100" width="30" height="24" rx="3" transform="rotate(210)"/>
        <rect x="-15" y="-100" width="30" height="24" rx="3" transform="rotate(240)"/>
        <rect x="-15" y="-100" width="30" height="24" rx="3" transform="rotate(270)"/>
        <rect x="-15" y="-100" width="30" height="24" rx="3" transform="rotate(300)"/>
        <rect x="-15" y="-100" width="30" height="24" rx="3" transform="rotate(330)"/>
      </g>
    </g>
    <!-- Pupil -->
    <ellipse cx="216" cy="216" rx="24" ry="60" fill="#001425"/>
    <!-- Shine -->
    <circle cx="244" cy="192" r="14" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
